<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>System Health Monitor</title>
	</head>
	<body>
		<button type="button" id="check-health-button">Check System Health</button>
		<p id="health-results" aria-live="polite"></p>

		<script>
			const checkHealthButton = document.getElementById("check-health-button");
			const healthResults = document.getElementById("health-results");

			checkHealthButton.addEventListener("click", async () => {
				healthResults.textContent = "Checking system health...";

				try {
					const response = await fetch("http://127.0.0.1:8000/api/health");

					if (!response.ok) {
						throw new Error(`Request failed with status ${response.status}`);
					}

					const health = await response.json();
					healthResults.textContent = `Status: ${health.status} | Timestamp: ${health.timestamp}`;
				} catch (error) {
					healthResults.textContent = `Unable to check system health: ${error.message}`;
				}
			});
		</script>
	</body>
</html>
